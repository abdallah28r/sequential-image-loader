<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sequential Image Loader: Advanced settings</title>
<link rel="stylesheet" href="theme.css" />
<link rel="stylesheet" href="options.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <svg class="logo" width="30" height="30" viewBox="0 0 48 48" aria-hidden="true">
        <rect class="f1" x="18" y="5" width="25" height="21" rx="4"/>
        <rect class="f2" x="11" y="12" width="25" height="21" rx="4"/>
        <rect class="f3" x="4" y="19" width="27" height="23" rx="4"/>
        <circle class="sun" cx="12" cy="27" r="3"/>
        <path class="hill" d="M6 39l8-8 5 5 4-3 6 6z"/>
      </svg>
      <div class="titles">
        <p class="eyebrow" data-i18n="title">Sequential Image Loader</p>
        <h1 data-i18n="optTitle">Advanced settings</h1>
      </div>
      <div class="segmented" role="radiogroup" data-i18n-label="themeTitle">
        <button type="button" role="radio" data-theme-choice="light" data-i18n-label="themeLight"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button type="button" role="radio" data-theme-choice="dark" data-i18n-label="themeDark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
        <button type="button" role="radio" data-theme-choice="auto" data-i18n-label="themeAuto"><span data-i18n="themeAuto">Auto</span></button>
      </div>
      <div class="segmented" role="radiogroup" data-i18n-label="language">
        <button type="button" role="radio" data-lang="en" lang="en">EN</button>
        <button type="button" role="radio" data-lang="ar" lang="ar" dir="rtl">ع</button>
      </div>
    </div>
  </header>

  <main class="page">
    <!-- Your rules: one folded row per site -->
    <section class="card">
      <h2 data-i18n="yourRules">Your rules</h2>
      <p class="muted small" data-i18n="sitesHint2"></p>
      <div class="add-row">
        <input id="siteInput" type="text" dir="ltr" spellcheck="false" autocomplete="off" data-i18n-placeholder="addSitePh" data-i18n-label="addSiteBtn" />
        <button type="button" id="siteBtn" class="btn btn-primary" data-i18n="addSiteBtn">+ Add site</button>
      </div>
      <p id="siteErr" class="field-err hidden" role="alert" data-i18n="badSite"></p>
      <p id="toast" class="toast" role="status" aria-live="polite"></p>

      <div id="emptyAll" class="muted hidden" data-i18n="noRules"></div>
      <ul id="siteList" class="site-folds"></ul>
      <p class="muted small" data-i18n="applyNote"></p>
    </section>

    <!-- Tester -->
    <section class="card">
      <h2><label for="testUrl" data-i18n="testTitle">Test a link</label></h2>
      <input id="testUrl" type="url" dir="ltr" spellcheck="false" autocomplete="off" data-i18n-placeholder="testPlaceholder" />
      <p id="testResult" class="test-result" role="status" aria-live="polite"></p>
    </section>

    <section class="card">
      <h2 data-i18n="tipsTitle">How links are matched</h2>
      <ul class="tips">
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
        <li data-i18n="tip4"></li>
        <li data-i18n="tip5"></li>
      </ul>
    </section>
  </main>
  <script src="theme.js"></script>
  <script src="i18n.js"></script>
  <script src="rules.js"></script>
  <script src="options.js"></script>
</body>
</html>
